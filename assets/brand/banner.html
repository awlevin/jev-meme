<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>jevmeme.fun banner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=JetBrains+Mono:wght@800&display=swap"
    />
    <style>
      /* The same tokens as app/globals.css. Keep them in step. */
      :root {
        --bg: #0a0a0a;
        --surface: #151515;
        --surface-2: #1f1f1f;
        --line: #2a2a2a;
        --text: #fafafa;
        --muted: #9a9a9a;
        --accent: #ffe14d;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
      }

      .banner {
        position: relative;
        width: 1280px;
        height: 640px;
        display: flex;
        align-items: center;
        padding: 0 80px;
        overflow: hidden;
        background:
          radial-gradient(ellipse 55% 70% at 78% 50%, rgb(255 225 77 / 0.1), transparent 70%),
          var(--bg);
        font-family: 'Inter', system-ui, sans-serif;
        color: var(--text);
      }

      /* --- The words ------------------------------------------------------- */

      .words {
        position: relative;
        width: 520px;
      }

      .wordmark {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-weight: 800;
        font-size: 30px;
        letter-spacing: -0.02em;
      }

      .wordmark span {
        color: var(--accent);
      }

      .hook {
        margin: 18px 0 0;
        font-weight: 800;
        font-size: 80px;
        line-height: 0.98;
        letter-spacing: -0.035em;
      }

      .pitch {
        margin: 28px 0 0;
        max-width: 19em;
        font-size: 25px;
        font-weight: 500;
        line-height: 1.4;
        color: var(--muted);
      }

      .pills {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 34px 0 0;
        padding: 0;
        list-style: none;
      }

      .pills li {
        padding: 8px 16px;
        border: 1px solid var(--line);
        border-radius: 99px;
        background: var(--surface-2);
        font-size: 17px;
        font-weight: 700;
        line-height: 1.2;
      }

      /* --- The meme -------------------------------------------------------- */

      .meme {
        position: absolute;
        top: 50%;
        right: 72px;
        width: 580px;
        border-radius: 18px;
        border: 1px solid var(--line);
        transform: translateY(-50%) rotate(2deg);
        box-shadow:
          0 30px 80px rgb(0 0 0 / 0.7),
          0 0 0 8px var(--surface);
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <div class="words">
        <div class="wordmark">jevmeme<span>.fun</span></div>
        <h1 class="hook">roasts by jev</h1>
        <p class="pitch">Pick photos. Ask a question.<br />Jev scores each one.</p>
        <ul class="pills">
          <li>Two pics</li>
          <li>Lineup</li>
          <li>Many Qs</li>
          <li>Find it</li>
        </ul>
      </div>

      <!-- A real meme from the app: jevmeme.fun/m/5x6pgyLCOe3e -->
      <img class="meme" src="meme.jpg" alt="" />
    </div>
  </body>
</html>
